name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 簽名金鑰優先順序:
      #   1) Repo Secret  KEYSTORE_BASE64(最穩;可跨 repo 保存)
      #   2) repo 內的 keystore/release.jks
      #   3) 都沒有 => 產生新的並存回 repo(此時舊版 APK 會因簽名不同而無法覆蓋)
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "KEY_SOURCE=Repo Secret(KEYSTORE_BASE64)" >> $GITHUB_ENV
          elif [ -f keystore/release.jks ]; then
            echo "KEY_SOURCE=repo 內既有的 keystore/release.jks" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore keystore/release.jks -alias monitor \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass phonemonitor -keypass phonemonitor \
              -dname "CN=PhoneMonitor, O=Personal, C=TW"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore/release.jks
            git commit -m "Add signing keystore [skip ci]"
            git push
            echo "KEY_SOURCE=★ 本次新產生的金鑰(若手機已裝舊版,需解除安裝一次)" >> $GITHUB_ENV
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          export VERSION_CODE=$(( $(date +%s) / 60 ))
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          gradle assembleRelease --no-daemon

      - name: Name APK and print signing fingerprint
        run: |
          cp app/build/outputs/apk/release/app-release.apk PhoneMonitor-v${{ github.run_number }}.apk
          FP=$(keytool -printcert -jarfile PhoneMonitor-v${{ github.run_number }}.apk | grep "SHA256:" | head -1 | sed 's/^ *//')
          {
            echo "### 簽名資訊"
            echo "- 金鑰來源:$KEY_SOURCE"
            echo "- 憑證指紋:\`$FP\`"
            echo "- versionCode:$VERSION_CODE"
            echo ""
            echo "每次更新的「憑證指紋」必須完全相同,才能直接覆蓋安裝。"
          } | tee release_notes.md >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMonitor-apk
          path: PhoneMonitor-v${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PhoneMonitor v${{ github.run_number }}
          body_path: release_notes.md
          files: PhoneMonitor-v${{ github.run_number }}.apk
          make_latest: true
