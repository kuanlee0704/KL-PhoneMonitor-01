name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 第一次執行時產生簽名金鑰並存回 repo。之後每次都用同一把 => APK 可直接覆蓋更新
      - name: Create signing keystore (first run only)
        run: |
          if [ ! -f keystore/release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore keystore/release.jks -alias monitor \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass phonemonitor -keypass phonemonitor \
              -dname "CN=PhoneMonitor, O=Personal, C=TW"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore/release.jks
            git commit -m "Add signing keystore [skip ci]"
            git push
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PhoneMonitor-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMonitor-apk
          path: PhoneMonitor-v${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PhoneMonitor v${{ github.run_number }}
          files: PhoneMonitor-v${{ github.run_number }}.apk
          make_latest: true
